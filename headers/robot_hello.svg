<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
    <style>
        .chassis {
            fill: #0d1117;
            stroke: #00D2FF;
            stroke-width: 2.5;
            filter: drop-shadow(0 0 4px #00D2FF);
        }
        .neon-glow {
            fill: #00D2FF;
            filter: drop-shadow(0 0 6px #00D2FF);
        }
        .heart-core {
            fill: #ff4081;
            filter: drop-shadow(0 0 5px #ff4081);
        }
        .accent {
            stroke: #9B51E0;
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
        }

        /* Chuyển động lơ lửng */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        /* Tay phải vẫy chào */
        @keyframes wave-arm {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-35deg); }
        }

        /* Nhịp đập trái tim */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .bot-body {
            animation: float 3s ease-in-out infinite;
            transform-origin: center;
        }

        .right-arm {
            animation: wave-arm 1.4s ease-in-out infinite;
            transform-origin: 135px 95px;
        }

        .heart {
            animation: pulse 1.5s ease-in-out infinite;
            transform-origin: 100px 105px;
        }
    </style>

    <g class="bot-body">
        <!-- Anten & Tai -->
        <line x1="100" y1="45" x2="100" y2="28" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round" />
        <circle cx="100" cy="24" r="4.5" class="neon-glow" />
        <rect x="62" y="55" width="6" height="14" rx="3" class="chassis" />
        <rect x="132" y="55" width="6" height="14" rx="3" class="chassis" />

        <!-- Đầu robot -->
        <rect x="68" y="42" width="64" height="42" rx="10" class="chassis" />
        
        <!-- Mắt & Miệng cười phát sáng -->
        <circle cx="88" cy="58" r="4" class="neon-glow" />
        <circle cx="112" cy="58" r="4" class="neon-glow" />
        <path d="M 92 68 Q 100 74 108 68" class="accent" />

        <!-- Khớp cổ -->
        <rect x="95" y="84" width="10" height="6" rx="2" fill="#9B51E0" />

        <!-- Thân -->
        <rect x="75" y="90" width="50" height="44" rx="8" class="chassis" />

        <!-- Trái tim AI trung tâm -->
        <g class="heart">
            <path d="M 100 112 L 95 106 A 3.5 3.5 0 0 1 100 101 A 3.5 3.5 0 0 1 105 106 Z" class="heart-core" />
        </g>

        <!-- Tay trái -->
        <path d="M 75 96 Q 58 105 50 115" class="accent" />
        <circle cx="48" cy="117" r="3.5" class="neon-glow" />

        <!-- Tay phải vẫy chào -->
        <g class="right-arm">
            <path d="M 125 96 Q 142 88 152 75" class="accent" />
            <circle cx="154" cy="73" r="3.5" class="neon-glow" />
        </g>

        <!-- Chân & Đế -->
        <line x1="88" y1="134" x2="88" y2="155" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round" />
        <rect x="83" y="155" width="12" height="6" rx="3" class="neon-glow" />

        <line x1="112" y1="134" x2="112" y2="155" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round" />
        <rect x="107" y="155" width="12" height="6" rx="3" class="neon-glow" />
    </g>
</svg>
